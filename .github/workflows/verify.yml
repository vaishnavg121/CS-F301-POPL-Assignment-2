name: Verify assignment code

on:
  push:
  pull_request:

jobs:
  language-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install required runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox racket python3
          swipl --version | tee /tmp/swipl-version.txt
          racket --version | tee /tmp/racket-version.txt
          grep -Eq "version 9\." /tmp/swipl-version.txt
          grep -Eq "v8\." /tmp/racket-version.txt
      - name: Execute all four test files
        run: |
          command -v swipl
          command -v racket
          set -o pipefail
          python3 tools/run_strict_tests.py 2>&1 | tee /tmp/ppl-tests.log
